<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404² — siciju.online</title>
  <meta name="theme-color" content="#060608">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23060608'/%3E%3Cg fill='none' stroke='%23d4ff4d' stroke-width='4.5' stroke-linecap='round'%3E%3Ccircle cx='32' cy='32' r='14'/%3E%3Cline x1='19' y1='45' x2='45' y2='19'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #060608;
      --surface: #101015;
      --text: #f2f0ea;
      --muted: #85827b;
      --accent: #d4ff4d;
      --accent-ink: #090a07;
      --border: rgba(242, 240, 234, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 50% 35%, rgba(212, 255, 77, 0.06), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .void-card {
      width: min(520px, 100%);
      padding: 2rem 1.75rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 0.9rem;
    }

    h1 {
      margin: 0 0 0.85rem;
      font-size: clamp(1.5rem, 4vw, 2.05rem);
      line-height: 1.15;
      letter-spacing: -0.025em;
    }

    .path-box {
      padding: 0.75rem 0.9rem;
      margin: 0 0 1.2rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.8rem;
      color: var(--muted);
      word-break: break-all;
    }

    .path-box strong {
      color: var(--text);
      font-weight: 500;
    }

    p.note {
      margin: 0 0 1.5rem;
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.3rem;
      border-radius: 999px;
      background: var(--text);
      color: var(--bg);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .back-btn:hover {
      background: var(--accent);
      color: var(--accent-ink);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main class="void-card">
    <div class="eyebrow">∅ ERROR 404² · SQUARED NOTHINGNESS</div>
    <h1>you looked for a missing page on a website that is already empty.</h1>
    <div class="path-box">
      <strong id="requested-path">siciju.online/404</strong> &rarr; somehow even emptier than the homepage.
    </div>
    <p class="note">
      The siciju.online homepage already has nothing on it. This subpage has even less.
    </p>
    <a class="back-btn" href="/">&larr; return to the main void</a>
  </main>

  <script>
    (function () {
      var el = document.getElementById('requested-path');
      if (el && window.location && window.location.pathname) {
        el.textContent = 'siciju.online' + window.location.pathname;
      }
    })();
  </script>
</body>
</html>
